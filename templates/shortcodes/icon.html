{#
  Usage in Markdown: {{ icon(name="rocket") }} or {{ icon(name="rocket", theme_aware=true) }}
  Theme-awareness means different (adaptive) look when light/dark theme is enabled.
#}
{%- set path = "static/icons/" ~ name ~ ".svg" -%}

<sub>
<span class="icon {% if theme_aware %}theme-aware{% endif -%}">
  {{ load_data(path=path) | safe }}
</span>
</sub>
