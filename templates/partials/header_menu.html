{% set pages_section = get_section(path="pages/_index.md") %}
{% set linked_pages = pages_section.pages | filter(attribute="extra.include_in_header") | sort(attribute="extra.header_order") %}
<nav class="c-header-menu">
    <a href="{{ config.base_url }}">Posts</a>
    {% for page in linked_pages %}
    <span aria-hidden="true">|</span>
    <a href="{{ page.permalink }}">{{ page.title }}</a>
    {% endfor %}
</nav>
